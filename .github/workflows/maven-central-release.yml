name: Release to Maven Central

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Deploy runs the integration tests, but only with Jackson 3
      # We run Jackson 2 IT manually
      - name: Jackson 2 Integration Tests
        run: ./mvnw -pl mcp-test -am -Pjackson2 test

      # Deploy runs all previous maven goals, including test and verify
      # Conformance tests are not published, and they break javadoc:aggregate: its forked
      # compile lifecycle never produces mcp classes (compiled at prepare-package), so their
      # dependency on mcp falls back to Maven Central, where the release does not exist yet.
      # Use the wrapper (Maven 3.9.x): with Maven 3.10, central-publishing 0.7.0 leaves
      # maven-metadata-local.xml files in the bundle, and Central rejects it.
      - name: Publish to Maven Central
        run: |
          ./mvnw --batch-mode \
            -Prelease \
            -Pjavadoc \
            -pl '!conformance-tests,!conformance-tests/client-jdk-http-client,!conformance-tests/client-spring-http-client,!conformance-tests/server-servlet' \
            clean deploy
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
