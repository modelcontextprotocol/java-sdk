name: Publish Snapshot

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Conformance tests are not published, and they break javadoc:aggregate: its forked
      # compile lifecycle never produces mcp classes (compiled at prepare-package), so their
      # dependency on mcp falls back to the local Maven repository, where the current
      # snapshot may not exist (e.g. right after a version bump, on a Maven cache miss).
      - name: Generate Java docs
        run: ./mvnw -Pjavadoc -B -pl '!conformance-tests,!conformance-tests/client-jdk-http-client,!conformance-tests/client-spring-http-client,!conformance-tests/server-servlet,!conformance-tests/server-servlet-modern' javadoc:aggregate

      - name: Jackson 2 Integration Tests
        run: ./mvnw -pl mcp-test -am -Pjackson2 test

      - name: Build with Maven and deploy to Sonatype snapshot repository
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          ./mvnw \
            -Pjavadoc \
            -Prelease \
            --batch-mode \
            -pl '!conformance-tests,!conformance-tests/client-jdk-http-client,!conformance-tests/client-spring-http-client,!conformance-tests/server-servlet,!conformance-tests/server-servlet-modern' \
            --update-snapshots deploy \
            -Dmaven.repository.credentialScope=id

      - name: Capture project version
        run: echo PROJECT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version --quiet -DforceStdout) >> $GITHUB_ENV
