<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img"
     aria-labelledby="title desc" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="title">MCP stack of the legacy client and server</title>
  <desc id="desc">On the client side, your application calls McpClient, which works through an McpSession on
    top of a client transport. On the server side, a server transport feeds an McpSession, on top of which
    McpServer serves the tools, resources and prompts you registered. The two sessions are set up with an
    initialize handshake and then carry requests in both directions, over STDIO, Streamable HTTP or SSE.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#999999"/>
    </marker>
  </defs>

  <!-- Client side -->
  <rect x="40" y="20" width="260" height="60" fill="#ffffff" stroke="#999999" stroke-dasharray="5 4"/>
  <text x="170" y="47" text-anchor="middle" font-size="17" fill="#777777">Your application</text>
  <text x="170" y="66" text-anchor="middle" font-size="12" fill="#999999">calls tools, resources, prompts</text>

  <rect x="40" y="80" width="260" height="60" fill="#ffffff" stroke="#999999"/>
  <text x="170" y="107" text-anchor="middle" font-size="17" font-weight="500" fill="#666666">McpClient</text>
  <text x="170" y="126" text-anchor="middle" font-size="12" fill="#999999">sync or async, one per server</text>

  <rect x="40" y="140" width="260" height="60" fill="#ffffff" stroke="#999999"/>
  <text x="170" y="167" text-anchor="middle" font-size="17" fill="#777777">McpSession</text>
  <text x="170" y="186" text-anchor="middle" font-size="12" fill="#999999">communication patterns and state</text>

  <rect x="40" y="200" width="260" height="66" fill="#999999" stroke="#999999"/>
  <text x="170" y="229" text-anchor="middle" font-size="17" fill="#ffffff">Client transport</text>
  <text x="170" y="249" text-anchor="middle" font-size="12" fill="#ffffff">JDK HttpClient or STDIO</text>

  <!-- Server side -->
  <rect x="420" y="20" width="260" height="60" fill="#ffffff" stroke="#999999" stroke-dasharray="5 4"/>
  <text x="550" y="47" text-anchor="middle" font-size="17" fill="#777777">Your tools, resources, prompts</text>
  <text x="550" y="66" text-anchor="middle" font-size="12" fill="#999999">registered on the server</text>

  <rect x="420" y="80" width="260" height="60" fill="#ffffff" stroke="#999999"/>
  <text x="550" y="107" text-anchor="middle" font-size="17" font-weight="500" fill="#666666">McpServer</text>
  <text x="550" y="126" text-anchor="middle" font-size="12" fill="#999999">sync or async</text>

  <rect x="420" y="140" width="260" height="60" fill="#ffffff" stroke="#999999"/>
  <text x="550" y="167" text-anchor="middle" font-size="17" fill="#777777">McpSession</text>
  <text x="550" y="186" text-anchor="middle" font-size="12" fill="#999999">one per connected client</text>

  <rect x="420" y="200" width="260" height="66" fill="#999999" stroke="#999999"/>
  <text x="550" y="229" text-anchor="middle" font-size="17" fill="#ffffff">Server transport</text>
  <text x="550" y="249" text-anchor="middle" font-size="12" fill="#ffffff">Servlet or STDIO</text>

  <!-- A session, set up once and then used both ways -->
  <text x="360" y="156" text-anchor="middle" font-size="12" fill="#777777">initialize once</text>
  <line x1="310" y1="164" x2="410" y2="164" stroke="#999999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="312" y1="178" x2="408" y2="178" stroke="#999999" stroke-width="1.5"
        marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <text x="360" y="195" text-anchor="middle" font-size="12" fill="#777777">requests both ways</text>

  <!-- Wire -->
  <path d="M 40 278 H 680 V 314 Q 680 338 656 338 H 64 Q 40 338 40 314 Z" fill="#999999"/>
  <text x="360" y="314" text-anchor="middle" font-size="17" fill="#ffffff">STDIO  |  Streamable HTTP  |  SSE</text>
</svg>
