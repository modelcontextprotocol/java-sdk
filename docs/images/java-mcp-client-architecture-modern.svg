<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img"
     aria-labelledby="title desc" font-family="'Open Sans', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="title">Modern Java MCP client architecture</title>
  <desc id="desc">A Java application talks to AI models and holds one McpClient per user. The clients of a
    remote server share one HTTP transport and reach the server over Streamable HTTP. A client of a local
    server uses a STDIO transport to reach a server process.</desc>

  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>

  <defs>
    <marker id="blueEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4648a8"/>
    </marker>
    <marker id="blueStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#4648a8"/>
    </marker>
  </defs>

  <!-- AI models -->
  <rect x="340" y="20" width="200" height="56" fill="#ffffff" stroke="#4648a8"/>
  <text x="440" y="55" text-anchor="middle" font-size="20" fill="#4648a8">AI Models</text>
  <line x1="440" y1="78" x2="440" y2="126" stroke="#4648a8" stroke-width="1.5"
        marker-start="url(#blueStart)" marker-end="url(#blueEnd)"/>

  <!-- The application -->
  <rect x="30" y="110" width="820" height="290" fill="none" stroke="#4648a8"/>
  <text x="52" y="144" font-size="20" fill="#4648a8">Your Java application</text>

  <rect x="330" y="128" width="220" height="48" fill="#7db249"/>
  <text x="440" y="158" text-anchor="middle" font-size="15" fill="#ffffff">Java Gen AI Application</text>

  <!-- Application to clients -->
  <path d="M 440 176 V 200 M 145 200 H 705 M 145 200 V 224 M 335 200 V 224 M 705 200 V 224"
        fill="none" stroke="#7db249" stroke-width="1.5"/>

  <!-- One client per user -->
  <rect x="60" y="224" width="170" height="54" fill="#7db249"/>
  <text x="145" y="247" text-anchor="middle" font-size="15" fill="#ffffff">McpClient</text>
  <text x="145" y="266" text-anchor="middle" font-size="12" fill="#ffffff">for Alice</text>

  <rect x="250" y="224" width="170" height="54" fill="#7db249"/>
  <text x="335" y="247" text-anchor="middle" font-size="15" fill="#ffffff">McpClient</text>
  <text x="335" y="266" text-anchor="middle" font-size="12" fill="#ffffff">for Bob</text>

  <rect x="620" y="224" width="170" height="54" fill="#7db249"/>
  <text x="705" y="247" text-anchor="middle" font-size="15" fill="#ffffff">McpClient</text>
  <text x="705" y="266" text-anchor="middle" font-size="12" fill="#ffffff">local tools</text>

  <!-- Clients to transports -->
  <path d="M 145 278 V 300 H 335 V 278 M 240 300 V 322 M 705 278 V 322"
        fill="none" stroke="#7db249" stroke-width="1.5"/>
  <text x="352" y="296" font-size="12" fill="#5f8f35">each call carries its user&apos;s context</text>

  <!-- Transports -->
  <rect x="100" y="322" width="280" height="54" fill="#ffffff" stroke="#7db249" stroke-width="1.5"/>
  <text x="240" y="345" text-anchor="middle" font-size="15" fill="#5f8f35">HTTP transport</text>
  <text x="240" y="364" text-anchor="middle" font-size="12" fill="#5f8f35">shared, one connection pool</text>

  <rect x="580" y="322" width="250" height="54" fill="#ffffff" stroke="#7db249" stroke-width="1.5"/>
  <text x="705" y="345" text-anchor="middle" font-size="15" fill="#5f8f35">STDIO transport</text>
  <text x="705" y="364" text-anchor="middle" font-size="12" fill="#5f8f35">starts the server process</text>

  <!-- Transports to servers -->
  <line x1="240" y1="376" x2="240" y2="470" stroke="#4648a8" stroke-width="1.5"/>
  <text x="254" y="438" font-size="13" fill="#4648a8">MCP Protocol (Streamable HTTP)</text>
  <line x1="705" y1="376" x2="705" y2="470" stroke="#4648a8" stroke-width="1.5"/>
  <text x="719" y="438" font-size="13" fill="#4648a8">MCP Protocol (STDIO)</text>

  <!-- Servers -->
  <rect x="130" y="470" width="220" height="60" fill="#4648a8"/>
  <text x="240" y="496" text-anchor="middle" font-size="15" fill="#ffffff">MCP Server</text>
  <text x="240" y="516" text-anchor="middle" font-size="12" fill="#ffffff">remote, stateless</text>

  <rect x="595" y="470" width="220" height="60" fill="#4648a8"/>
  <text x="705" y="496" text-anchor="middle" font-size="15" fill="#ffffff">MCP Server</text>
  <text x="705" y="516" text-anchor="middle" font-size="12" fill="#ffffff">local process</text>
</svg>
